name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Monitoring.sln
      - name: Format check
        run: dotnet format Monitoring.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Monitoring.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Monitoring.sln --configuration Release --no-build --verbosity normal
